name: Scheduled Currency Analysis Report

on:
  schedule:
    # 北京时间每天早上 9:00 运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests

      - name: Execute Currency Script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          DATE_RANGE: ${{ vars.DATE_RANGE }}
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          FX_DB_PATH: data/fx_data.db
          FX_INIT_DAYS: '365'
        run: |
          python get_currency.py

      - name: Commit updated SQLite DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/fx_data.db ]; then
            echo "No SQLite DB file generated."
            exit 0
          fi
          git add data/fx_data.db
          git diff --cached --quiet && echo "No DB changes to commit." && exit 0
          git commit -m "chore: update offline FX sqlite database"
          git push

      - name: Upload Report as Artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: currency-report
          path: paired_currency_report.html
